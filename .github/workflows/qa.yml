name: MVP QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
      - run: node qa.js
      - run: node --check .qa-extracted.js
      - run: rm -f .qa-extracted.js
