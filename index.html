<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composable Incident Response Modules</title>
<style>
:root{--bg:#0b1118;--panel:#121b26;--line:#263547;--text:#edf3f8;--muted:#91a2b4;--accent:#58d6ad;--warn:#f2c36d;--danger:#ff8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:20px 14px;background:#091018}.brand{font-weight:800;font-size:16px}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:3px}.scenario{margin:20px 0 14px;padding:10px;border:1px solid var(--line);border-radius:10px}.scenario label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.scenario select{width:100%;margin-top:5px;background:#0e1721;color:var(--text);border:0;padding:5px}.nav{display:grid;gap:4px}.nav button,.btn{background:#13202d;color:#b9c8d6;border:1px solid var(--line);border-radius:8px;padding:9px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover,.btn:hover{border-color:#456079;color:white}.main{padding:26px;max-width:1450px;width:100%;margin:auto}.top{margin-bottom:20px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.title{font-size:28px;margin:5px 0}.sub{color:var(--muted);max-width:800px}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(6,1fr)}.cards{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1fr 1fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.metric .k,.label{font-size:10px;color:var(--muted);text-transform:uppercase}.metric .v{font-size:23px;font-weight:800}.module{cursor:pointer}.module h3{font-size:13px;margin:7px 0 3px}.module p{font-size:11px;color:var(--muted);margin:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h2{font-size:15px;margin:0}.notice{padding:11px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{border-color:#317d67;background:#12352d;color:#9bf0d0}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;text-align:left;border-bottom:1px solid #20303f;font-size:12px}th{font-size:10px;color:var(--muted);text-transform:uppercase}.badge{padding:3px 7px;border:1px solid #385069;border-radius:99px;font-size:10px}.ok{color:#8ce6c6;border-color:#2e6a58}.hi{color:#ffd080;border-color:#69552b}.danger{color:#ff9b9b;border-color:#663838}.flow{display:flex;gap:6px;overflow:auto}.step{min-width:110px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:11px}.timeline{display:grid}.event{display:grid;grid-template-columns:70px 12px 1fr;gap:8px;min-height:54px}.event time{color:var(--muted);font-size:10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px}.eventbody{border-left:1px solid var(--line);padding:0 0 12px 10px}.eventbody strong{font-size:12px}.eventbody p{margin:2px 0;color:var(--muted);font-size:11px}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.app{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.main{padding:16px}.metrics,.cards,.two{grid-template-columns:1fr 1fr}.title{font-size:23px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Composable Response<small>Incident Response Modules</small></div>
<div class="scenario"><label>Demo scenario</label><select id="scenario"><option value="wildfire">Wildfire Response</option><option value="sar">Search & Rescue</option><option value="infra">Infrastructure Incident</option></select></div>
<nav class="nav" id="nav">
<button class="active" data-page="overview">01 Overview</button><button data-page="incidents">02 Incidents</button><button data-page="verification">03 Verification</button><button data-page="resources">04 Resources</button><button data-page="tasks">05 Tasks</button><button data-page="dispatch">06 Dispatch</button><button data-page="feedback">07 Field Feedback</button><button data-page="coordination">08 Coordination</button><button data-page="timeline">09 Timeline</button><button data-page="resolution">10 Resolution</button><button data-page="reporting">11 Reporting</button></nav></aside>
<main class="main" id="main"></main></div>
<script>
const scenarios={
wildfire:{name:"Wildfire Response",type:"Wildfire",loc:"North Ridge Sector",id:"INC-2407",priority:"High",team:"Rapid Response Unit 3"},
sar:{name:"Search & Rescue",type:"Missing Person",loc:"Cedar Valley Trail",id:"INC-2419",priority:"Critical",team:"Search Team Alpha"},
infra:{name:"Infrastructure Incident",type:"Power / Facility",loc:"West Industrial Corridor",id:"INC-2431",priority:"High",team:"Field Operations 2"}
};
const modules=[["Incident","Capture, prioritize and track events."],["Verification","Turn signals into verified facts."],["Resource","Model people, teams and assets."],["Task","Convert decisions into executable work."],["Dispatch","Match capability, availability and priority."],["Field Feedback","Bring structured evidence back."],["Coordination","Keep participating teams aligned."],["Timeline","Preserve the operational chain."],["Resolution","Close the operational loop."],["Reporting","Measure response performance."]];
let scenario="wildfire",page="overview",feedback=false,closed=false;
const S=()=>scenarios[scenario];
function badge(v){let c=/critical|overdue/i.test(v)?"danger":/high|pending/i.test(v)?"hi":"ok";return '<span class="badge '+c+'">'+v+'</span>'}
function shell(title,desc){return '<div class="top"><div class="eyebrow">Reference Product · MVP</div><div class="title">'+title+'</div><div class="sub">'+desc+'</div></div>'}
function metrics(){return '<div class="grid metrics">'+[['Active Incidents',3],['Pending Verification',1],['Active Tasks',3],['Available Resources',12],['Overdue Tasks',0],['Resolved Today',2]].map(x=>'<div class="card metric"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('')+'</div>'}
function overview(){return shell(S().name,"A vendor-neutral workflow layer. Build once. Split anywhere. Combine as needed.")+
metrics()+'<div class="card" style="margin:12px 0"><div class="head"><h2>Core workflow</h2><span class="label">End-to-end chain</span></div><div class="flow">'+["Incident Discovery","Verification","Decision","Resource Matching","Task","Dispatch","Field Feedback","Resolution","Closure","Reporting"].map(x=>'<div class="step">'+x+'</div>').join('')+'</div></div>'+
'<div class="head"><h2>Composable modules</h2><span class="label">10 reusable units</span></div><div class="grid cards">'+modules.map((m,i)=>'<div class="card module" onclick="go(\'\'+["incidents","verification","resources","tasks","dispatch","feedback","coordination","timeline","reporting","reporting"][i]+\'\')"><div class="label">0'+(i+1)+'</div><h3>'+m[0]+'</h3><p>'+m[1]+'</p></div>').join('')+'</div>'+
'<div class="card" style="margin-top:12px"><div class="head"><h2>Commercial composition</h2><span class="label">Packaging model</span></div><div class="flow">'+["Single Module","Module Bundle","Scenario Package","Full Workflow","White-label / OEM"].map(x=>'<div class="step">'+x+'</div>').join('')+'</div></div>'}
function incidents(){let rows=[[S().id,S().type,S().priority,S().loc,"Verifying",S().team],["INC-2398","Operational Event","High","East Basin","In Progress","Response Team 1"],["INC-2389","False Alarm","Low","Lake Access","Closed","Verification Team 2"]];return shell("Incidents","Track active and recent incidents for the selected scenario.")+'<div class="card"><div class="head"><h2>Incident register</h2><span class="label">Fictional data</span></div><table><tr><th>ID</th><th>Type</th><th>Priority</th><th>Location</th><th>Status</th><th>Team</th></tr>'+rows.map(r=>'<tr><td><button class="btn" onclick="go(\'verification\')">'+r[0]+'</button></td><td>'+r[1]+'</td><td>'+badge(r[2])+'</td><td>'+r[3]+'</td><td>'+badge(r[4])+'</td><td>'+r[5]+'</td></tr>').join('')+'</table></div>'}
function verification(){return shell("Verification","Turn an initial signal into a decision supported by structured evidence.")+'<div class="grid two"><div class="card"><div class="head"><h2>'+S().id+'</h2>'+badge(S().priority)+'</div><div class="label">Signal</div><p>'+S().type+' reported at '+S().loc+'.</p><div class="label">Recommended verifier</div><p>'+S().team+'</p><div class="actions"><button class="btn primary" onclick="go(\'resources\')">Confirm & match resources</button><button class="btn warn" onclick="alert(\'Demo: more information requested.\')">More information</button><button class="btn" onclick="alert(\'Demo: false alarm branch.\')">False alarm</button></div></div><div class="card"><div class="head"><h2>Verification checklist</h2></div>'+["Signal received","Location reviewed","Evidence requested","Verifier assigned","Operational decision"].map((x,i)=>'<div class="notice" style="margin:7px 0">'+(i<3?"✓ ":"○ ")+x+'</div>').join('')+'</div></div>'}
function resources(){return shell("Resources","Neutral resource model for people, teams, vehicles, equipment and facilities.")+'<div class="card"><table><tr><th>Name</th><th>Type</th><th>Status</th><th>Capability</th><th>Location</th><th>Current Task</th></tr>'+[
["Alex Morgan","Person","Available","Field Verification","North Ridge","T-882"],["Response Team 3","Team","Available","Verification","North Ridge","—"],["Unit R-12","Vehicle","Assigned","Rapid Transport","2.4 km away","T-882"],["Drone Unit 4","Equipment","Available","Aerial Observation","North Ridge","—"],["Operations Base","Facility","Available","Coordination","Sector 4","—"]
].map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i==2?badge(x):x)+'</td>').join('')+'</tr>').join('')+'</table><div class="notice" style="margin-top:12px">Transparent matching rule: Capability + Availability + Distance + Priority.</div></div>'}
function tasks(){return shell("Tasks","Convert decisions into explicit, trackable work items.")+'<div class="card"><div class="head"><h2>Task board</h2><button class="btn primary" onclick="alert(\'Demo: T-885 created.\')">Create task</button></div><table><tr><th>ID</th><th>Incident</th><th>Type</th><th>Assignee</th><th>Priority</th><th>Status</th></tr>'+[["T-882",S().id,"Verification","Response Team 3","High","Assigned"],["T-883",S().id,"Field Assessment","Alex Morgan","High","In Progress"],["T-884",S().id,"Resource Staging","Unit R-12","Medium","Pending"]].map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i==4||i==5?badge(x):x)+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function dispatch(){return shell("Dispatch","Move tasks forward using transparent and explainable resource matching.")+'<div class="grid two"><div class="card"><div class="head"><h2>Recommended resources</h2></div>'+[["Response Team 3","Capability match","0.96"],["Alex Morgan","Capability + distance","0.91"],["Unit R-12","Transport + distance","0.84"]].map(r=>'<div class="notice" style="margin:7px 0"><b>'+r[0]+'</b> · '+r[1]+' <strong style="float:right">'+r[2]+'</strong></div>').join('')+'<button class="btn primary" onclick="alert(\'Demo: T-882 dispatched.\')">Dispatch selected</button></div><div class="card"><h2>Execution state</h2><div class="notice">No real dispatch integration is connected. This demonstrates the business decision layer.</div></div></div>'}
function feedbackPage(){return shell("Field Feedback","Structured field evidence closes the loop between dispatch and resolution.")+'<div class="grid two"><div class="card"><div class="head"><h2>Task T-883</h2><span class="label">Simulation</span></div><div class="notice">'+(feedback?"15:08 · Field result received: observation confirmed and access route is clear.":"Awaiting field observation…")+'</div><div class="actions"><button class="btn primary" onclick="feedback=true;go(\'feedback\')">'+(feedback?"Feedback received":"Submit field update")+'</button><button class="btn">Attach image</button><button class="btn">Attach video</button><button class="btn">Attach audio</button></div></div><div class="card"><h2>Accepted evidence types</h2><p class="sub">Text, image, video, voice and structured status updates can be represented here. Actual storage/integration belongs to the implementer.</p></div></div>'}
function coordination(){return shell("Coordination","Keep participating teams aligned without turning the workflow into a chat product.")+'<div class="grid two"><div class="card"><h2>Participants</h2>'+[["Response Team 3","Verification","In Progress"],["Field Operations 2","Support","Available"],["Operations Base","Coordination","Active"]].map(r=>'<div class="notice" style="margin:7px 0"><b>'+r[0]+'</b> · '+r[1]+' · '+r[2]+'</div>').join('')+'</div><div class="card"><h2>Operational log</h2>'+["Task assigned","Resource updated","Field feedback received"].map(x=>'<div class="notice" style="margin:7px 0">'+x+'</div>').join('')+'</div></div>'}
function timeline(){return shell("Timeline","One operational chain preserved from first signal to closure.")+'<div class="card timeline">'+[["14:02","Incident discovered","Initial signal created for "+S().loc+"."],["14:06","Verification started","Candidate resources identified."],["14:18","Incident confirmed","Evidence supports operational response."],["14:24","Dispatch initiated","T-882 assigned using transparent matching."],["15:02","Execution in progress","Field team reports current state."],[feedback?"15:08":"—","Field feedback",feedback?"Structured field result received.":"Awaiting field feedback."],[closed?"15:15":"—","Resolution / closure",closed?"Incident closed in demo.":"Pending resolution."]].map(e=>'<div class="event"><time>'+e[0]+'</time><div class="dot"></div><div class="eventbody"><strong>'+e[1]+'</strong><p>'+e[2]+'</p></div></div>').join('')+'</div><div class="actions"><button class="btn primary" onclick="closed=true;go(\'timeline\')">Resolve & close</button></div>'}
function resolutionPage(){return shell('Resolution & Closure','Convert field results into a controlled closeout.')+'<div class="grid two"><div class="card"><h2>Closeout decision</h2><div class="notice">Incident '+S().id+' has a simulated field result ready for closeout.</div><div class="actions"><button class="btn primary" onclick="closed=true;go(\'resolution\')">Mark resolved & close</button><button class="btn" onclick="go(\'timeline\')">Return to timeline</button></div></div><div class="card"><h2>Closeout record</h2><div class="notice">Outcome: '+(closed?'Resolved / Closed':'Pending closeout')+'</div><div class="notice" style="margin-top:8px">Evidence: '+(feedback?'Field feedback received':'Awaiting field feedback')+'</div></div></div>'}function reporting(){return shell("Reporting","Lightweight measures for workflow performance and bottlenecks.")+metrics()+'<div class="grid two" style="margin-top:12px"><div class="card"><h2>Response stages</h2>'+[["Discovery → Verification","4 min"],["Verification → Dispatch","6 min"],["Dispatch → Feedback","18 min"],["Feedback → Resolution","11 min"]].map(r=>'<div class="notice" style="margin:7px 0;display:flex;justify-content:space-between">'+r[0]+' <b>'+r[1]+'</b></div>').join('')+'</div><div class="card"><h2>Boundary</h2><div class="notice">Reporting measures the workflow itself, not an underlying GIS, communications network or sensor platform.</div></div></div>'}
function go(p){page=p;render()}function render(){let map={overview,incidents,verification,resources,tasks,dispatch,feedback:feedbackPage,coordination,timeline,resolution:resolutionPage,reporting};document.getElementById("main").innerHTML=map[page]();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
document.getElementById("scenario").onchange=e=>{scenario=e.target.value;feedback=false;closed=false;page="overview";render()};document.getElementById("nav").onclick=e=>{let b=e.target.closest("button");if(b)go(b.dataset.page)};render();
</script></body></html>
